<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
</head>
<body>
    
    <script>
    let pesoTexto = prompt("Qual seu peso?") 
    let alturaTexto = prompt("Qual sua altura em metros?")

    let peso = Number(pesoTexto);
    let altura = Number(alturaTexto);

    let IMC = peso / (altura * altura);

    if(IMC < 18.5){
        alert(IMC + "abaixo do peso");
    }else if (IMC >= 18.5 && IMC <= 24.99) {
        alert(IMC + "peso ideal");
    } else if(IMC >= 25 && IMC <= 29.99) {
        alert(IMC + "sobrepeso");
    }else if(IMC >= 30){
        alert(IMC + "obesidade");
    }
    </script>
</body>
</html>
